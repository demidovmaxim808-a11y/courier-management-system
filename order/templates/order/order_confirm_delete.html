{% extends "base.html" %}

{% block title %}Удаление заказа{% endblock %}

{% block content %}
<h1 class="text-danger">Удалить заказ?</h1>
<p>Вы уверены, что хотите удалить заказ <strong>{{ order.number }}</strong>?</p>

<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Да, удалить</button>
    <a href="{% url 'order:order_detail' order.id %}" class="btn btn-secondary">Отмена</a>
</form>
{% endblock %}
