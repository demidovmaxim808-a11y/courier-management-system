{% extends "base.html" %}

{% block title %}Статистика{% endblock %}

{% block content %}
<h1>Статистика заказов по курьерам</h1>

<table class="table table-striped">
    <thead>
        <tr>
            <th>Курьер</th>
            <th>Всего заказов</th>
            <th>Заказов в пути</th>
        </tr>
    </thead>
    <tbody>
        {% for row in stats %}
        <tr>
            <td>{{ row.name }}</td>
            <td>{{ row.total_orders }}</td>
            <td>{{ row.active_orders }}</td>
        </tr>
        {% empty %}
        <tr>
            <td colspan="3">Данных нет.</td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
